services:
  db:
    image: mysql:8.4
    container_name: mibodega-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: mibodega
      MYSQL_USER: bodega
      MYSQL_PASSWORD: bodega1234
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
